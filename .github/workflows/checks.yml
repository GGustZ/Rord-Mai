name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: rordmai_test
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: rordmai_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rordmai_test -d rordmai_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://rordmai_test:test-only@localhost:5432/rordmai_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json
      - run: npm ci --prefix apps/api
      - run: npm ci --prefix apps/web
      - run: npm run check
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm --prefix apps/web run test:browser
      - run: docker build -t rord-mai:check .
      - name: Verify native syllabus recognition
        run: |
          docker run --rm --entrypoint tesseract -v "$PWD/apps/api/tests/fixtures/printed-syllabus.png:/tmp/syllabus.png:ro" rord-mai:check /tmp/syllabus.png stdout -l tha+eng --psm 6 > /tmp/rordmai-ocr.txt
          node -e "const assert=require('node:assert/strict');const fs=require('node:fs');const {parseSyllabus}=require('./apps/api/src/services/ocr-service');assert.deepEqual(parseSyllabus(fs.readFileSync('/tmp/rordmai-ocr.txt','utf8')).components.map(c=>c.weightPercent),[40,60]);"
      - name: Verify container startup and Compose configuration
        env:
          DATABASE_URL: postgresql://rordmai_test:test-only@localhost:5432/rordmai_smoke
          POSTGRES_PASSWORD: test-only
          LINE_LOGIN_CHANNEL_ID: '123'
          LIFF_ID: '123-test'
          LINE_CHANNEL_SECRET: test-only-secret
          LINE_CHANNEL_ACCESS_TOKEN: test-only-token
        run: |
          docker compose config --quiet
          node -e "(async()=>{const {Pool}=require('./apps/api/node_modules/pg');const p=new Pool({connectionString:process.env.TEST_DATABASE_URL});try{await p.query('CREATE DATABASE rordmai_smoke')}finally{await p.end()}})().catch(e=>{console.error(e.message);process.exitCode=1})"
          trap 'docker rm -f rord-mai-smoke >/dev/null 2>&1 || true' EXIT
          docker run -d --name rord-mai-smoke --network host --env DATABASE_URL --env LINE_CHANNEL_SECRET --env LINE_CHANNEL_ACCESS_TOKEN --env LINE_LOGIN_CHANNEL_ID --env LIFF_ID --env STORAGE_POLICY_VERSION=v1 rord-mai:check
          curl --fail --silent --retry 30 --retry-all-errors --retry-delay 2 --retry-max-time 90 http://127.0.0.1:3000/ready
          node scripts/check-deployment.cjs http://127.0.0.1:3000
