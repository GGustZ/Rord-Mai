services:
  - type: web
    name: rord-mai-progress
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /ready
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rord-mai-progress-db
          property: connectionString
      - key: LINE_LOGIN_CHANNEL_ID
        sync: false
      - key: LIFF_ID
        sync: false
      - key: STORAGE_POLICY_VERSION
        value: 2026-09-demo-v1
databases:
  - name: rord-mai-progress-db
    plan: free
    region: singapore
    databaseName: rordmai
    user: rordmai

