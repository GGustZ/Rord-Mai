<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1470" role="img" aria-labelledby="title-line-processing desc-line-processing" style="font-family:Arial, Helvetica, sans-serif"><title id="title-line-processing">LINE intake and deadline delivery</title><desc id="desc-line-processing">Two independent LINE processing flows. Signed consented webhook work commits before acknowledgement; a consentless reminder stays request-local and sends afterward. A separate GitHub Actions runner rechecks eligible academic targets and consent, persists retry keys before sending, and records outcomes.</desc><defs><marker id="arrow-line-processing-front" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#000000"/></marker><marker id="arrow-line-processing-back" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#000000"/></marker><marker id="arrow-line-processing-db" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#000000"/></marker><marker id="arrow-line-processing-cloud" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#000000"/></marker><marker id="arrow-line-processing-security" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#000000"/></marker><marker id="arrow-line-processing-bus" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#000000"/></marker><marker id="arrow-line-processing-external" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#000000"/></marker></defs><rect width="1600" height="1470" fill="#ffffff"/><text x="48" y="48" font-size="14" fill="#000000" text-anchor="start" font-weight="600">RORD-MAI / FIGURE 08</text><text x="48" y="89" font-size="30" fill="#000000" text-anchor="start" font-weight="600">LINE intake and deadline delivery</text><text x="48" y="119" font-size="14" fill="#000000" text-anchor="start" font-weight="400">Durable chat acceptance and a separate, idempotent scheduled notification runner.</text><rect x="40" y="165" width="730" height="1140" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2" stroke-dasharray="8 5"/><text x="56" y="191" font-size="14" fill="#000000" text-anchor="start" font-weight="600">A  WEBHOOK INTAKE AND CHAT REPLY</text><rect x="830" y="165" width="730" height="1140" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2" stroke-dasharray="8 5"/><text x="846" y="191" font-size="14" fill="#000000" text-anchor="start" font-weight="600">B  SEPARATE SCHEDULED DEADLINE DELIVERY</text><polyline points="405,295 405,350" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" stroke-dasharray="6 5" marker-end="url(#arrow-line-processing-security)"/><polyline points="220,425 220,480" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" stroke-dasharray="6 5" marker-end="url(#arrow-line-processing-security)"/><polyline points="590,425 590,480" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" stroke-dasharray="none" marker-end="url(#arrow-line-processing-db)"/><polyline points="590,610 590,680" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" stroke-dasharray="none" marker-end="url(#arrow-line-processing-bus)"/><polyline points="590,785 590,855" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" stroke-dasharray="none" marker-end="url(#arrow-line-processing-bus)"/><polyline points="405,960 405,1030" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" stroke-dasharray="none" marker-end="url(#arrow-line-processing-db)"/><polyline points="1195,295 1195,350" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" stroke-dasharray="none" marker-end="url(#arrow-line-processing-cloud)"/><polyline points="1195,455 1195,520" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" stroke-dasharray="none" marker-end="url(#arrow-line-processing-back)"/><polyline points="1195,625 1195,690" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" stroke-dasharray="none" marker-end="url(#arrow-line-processing-db)"/><polyline points="1195,795 1195,860" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" stroke-dasharray="none" marker-end="url(#arrow-line-processing-bus)"/><polyline points="1195,965 1195,1030" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" stroke-dasharray="none" marker-end="url(#arrow-line-processing-db)"/><g class="node" data-title="LINE sends raw event + signature" data-x="80" data-y="220" data-w="650" data-h="75"><rect x="80" y="220" width="650" height="75" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><path d="M80 255H730" fill="none" stroke="#000000" stroke-width="1.2"/><text x="405.0" y="245" font-size="19" fill="#000000" text-anchor="middle" font-weight="600">LINE sends raw event + signature</text><text x="98" y="270" font-size="15" fill="#000000" text-anchor="start" font-weight="400">Verify original bytes before JSON parsing</text></g><g class="node" data-title="Check event and current storage consent" data-x="80" data-y="350" data-w="650" data-h="75"><rect x="80" y="350" width="650" height="75" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><path d="M80 385H730" fill="none" stroke="#000000" stroke-width="1.2"/><text x="405.0" y="375" font-size="19" fill="#000000" text-anchor="middle" font-weight="600">Check event and current storage consent</text><text x="98" y="400" font-size="15" fill="#000000" text-anchor="start" font-weight="400">Invalid signature -&gt; 401; malformed event -&gt; 400</text></g><g class="node" data-title="Consent missing" data-x="80" data-y="480" data-w="280" data-h="130"><rect x="80" y="480" width="280" height="130" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><path d="M80 515H360" fill="none" stroke="#000000" stroke-width="1.2"/><text x="220.0" y="505" font-size="19" fill="#000000" text-anchor="middle" font-weight="600">Consent missing</text><text x="98" y="530" font-size="14" fill="#000000" text-anchor="start" font-weight="400">No identity/text/job saved</text><text x="98" y="550" font-size="14" fill="#000000" text-anchor="start" font-weight="400">Hold reply token in memory</text><text x="98" y="570" font-size="14" fill="#000000" text-anchor="start" font-weight="400">Acknowledge HTTP 200</text><text x="98" y="590" font-size="14" fill="#000000" text-anchor="start" font-weight="400">Then send consent reminder</text></g><g class="node" data-title="Consent current" data-x="450" data-y="480" data-w="280" data-h="130"><rect x="450" y="480" width="280" height="130" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><path d="M450 515H730" fill="none" stroke="#000000" stroke-width="1.2"/><text x="590.0" y="505" font-size="19" fill="#000000" text-anchor="middle" font-weight="600">Consent current</text><text x="468" y="530" font-size="14" fill="#000000" text-anchor="start" font-weight="400">Commit private_jobs record</text><text x="468" y="550" font-size="14" fill="#000000" text-anchor="start" font-weight="400">Deduplicate event_id</text><text x="468" y="570" font-size="14" fill="#000000" text-anchor="start" font-weight="400">DB failure -&gt; HTTP 503</text><text x="468" y="590" font-size="14" fill="#000000" text-anchor="start" font-weight="400">Commit -&gt; HTTP 200</text></g><g class="node" data-title="Worker wakes" data-x="450" data-y="680" data-w="280" data-h="105"><rect x="450" y="680" width="280" height="105" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><path d="M450 715H730" fill="none" stroke="#000000" stroke-width="1.2"/><text x="590.0" y="705" font-size="19" fill="#000000" text-anchor="middle" font-weight="600">Worker wakes</text><text x="468" y="730" font-size="14" fill="#000000" text-anchor="start" font-weight="400">Reuse academic services</text><text x="468" y="750" font-size="14" fill="#000000" text-anchor="start" font-weight="400">Save state and reply job</text></g><g class="node" data-title="Reply through LINE Messaging API" data-x="80" data-y="855" data-w="650" data-h="105"><rect x="80" y="855" width="650" height="105" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><path d="M80 890H730" fill="none" stroke="#000000" stroke-width="1.2"/><text x="405.0" y="880" font-size="19" fill="#000000" text-anchor="middle" font-weight="600">Reply through LINE Messaging API</text><text x="98" y="905" font-size="15" fill="#000000" text-anchor="start" font-weight="400">Single-use reply token; no push fallback for a failed reply</text><text x="98" y="925" font-size="15" fill="#000000" text-anchor="start" font-weight="400">Academic mutation is not repeated when retrying a reply</text></g><g class="node" data-title="Scrub and expire private processing data" data-x="80" data-y="1030" data-w="650" data-h="105"><rect x="80" y="1030" width="650" height="105" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><path d="M80 1065H730" fill="none" stroke="#000000" stroke-width="1.2"/><text x="405.0" y="1055" font-size="19" fill="#000000" text-anchor="middle" font-weight="600">Scrub and expire private processing data</text><text x="98" y="1080" font-size="15" fill="#000000" text-anchor="start" font-weight="400">Conversation inactivity expiry: 15 minutes</text><text x="98" y="1100" font-size="15" fill="#000000" text-anchor="start" font-weight="400">Event expiry: five minutes; worker cleans expired records</text></g><g class="node" data-title="Timing limit" data-x="80" data-y="1180" data-w="650" data-h="107"><rect x="80" y="1180" width="650" height="107" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><path d="M80 1215H730" fill="none" stroke="#000000" stroke-width="1.2"/><text x="405.0" y="1205" font-size="17" fill="#000000" text-anchor="middle" font-weight="600">Timing limit</text><text x="98" y="1230" font-size="14" fill="#000000" text-anchor="start" font-weight="400">Post-ack reminder is not on the acknowledgement path.</text><text x="98" y="1250" font-size="14" fill="#000000" text-anchor="start" font-weight="400">Database acceptance and host cold starts can still exceed one second.</text></g><g class="node" data-title="GitHub Actions -&gt; deadline runner" data-x="870" data-y="220" data-w="650" data-h="75"><rect x="870" y="220" width="650" height="75" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><path d="M870 255H1520" fill="none" stroke="#000000" stroke-width="1.2"/><text x="1195.0" y="245" font-size="19" fill="#000000" text-anchor="middle" font-weight="600">GitHub Actions -&gt; deadline runner</text><text x="888" y="270" font-size="15" fill="#000000" text-anchor="start" font-weight="400">Hourly at minute 17 UTC; manual dispatch also supported</text></g><g class="node" data-title="Acquire advisory lock; select candidates" data-x="870" data-y="350" data-w="650" data-h="105"><rect x="870" y="350" width="650" height="105" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><path d="M870 385H1520" fill="none" stroke="#000000" stroke-width="1.2"/><text x="1195.0" y="375" font-size="19" fill="#000000" text-anchor="middle" font-weight="600">Acquire advisory lock; select candidates</text><text x="888" y="400" font-size="15" fill="#000000" text-anchor="start" font-weight="400">Criterion course, recorded target and current storage consent</text><text x="888" y="420" font-size="15" fill="#000000" text-anchor="start" font-weight="400">Before withdrawal deadline at end of day, Asia/Bangkok</text></g><g class="node" data-title="Recalculate eligibility under account lock" data-x="870" data-y="520" data-w="650" data-h="105"><rect x="870" y="520" width="650" height="105" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><path d="M870 555H1520" fill="none" stroke="#000000" stroke-width="1.2"/><text x="1195.0" y="545" font-size="19" fill="#000000" text-anchor="middle" font-weight="600">Recalculate eligibility under account lock</text><text x="888" y="570" font-size="15" fill="#000000" text-anchor="start" font-weight="400">Target must be unreachable using current recorded inputs</text><text x="888" y="590" font-size="15" fill="#000000" text-anchor="start" font-weight="400">Unique notification per student + section</text></g><g class="node" data-title="Persist body, retry_key and attempt before send" data-x="870" data-y="690" data-w="650" data-h="105"><rect x="870" y="690" width="650" height="105" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><path d="M870 725H1520" fill="none" stroke="#000000" stroke-width="1.2"/><text x="1195.0" y="715" font-size="19" fill="#000000" text-anchor="middle" font-weight="600">Persist body, retry_key and attempt before send</text><text x="888" y="740" font-size="15" fill="#000000" text-anchor="start" font-weight="400">Recheck consent and eligibility before bounded LINE push</text><text x="888" y="760" font-size="15" fill="#000000" text-anchor="start" font-weight="400">Same idempotency key is reused after crashes / retries</text></g><g class="node" data-title="Send once logically; store outcome" data-x="870" data-y="860" data-w="650" data-h="105"><rect x="870" y="860" width="650" height="105" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><path d="M870 895H1520" fill="none" stroke="#000000" stroke-width="1.2"/><text x="1195.0" y="885" font-size="19" fill="#000000" text-anchor="middle" font-weight="600">Send once logically; store outcome</text><text x="888" y="910" font-size="15" fill="#000000" text-anchor="start" font-weight="400">Success -&gt; sent; no longer eligible -&gt; cancelled</text><text x="888" y="930" font-size="15" fill="#000000" text-anchor="start" font-weight="400">Retry transient failure; maximum three attempts -&gt; failed</text></g><g class="node" data-title="Repeat runs do not create a second notification" data-x="870" data-y="1030" data-w="650" data-h="105"><rect x="870" y="1030" width="650" height="105" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><path d="M870 1065H1520" fill="none" stroke="#000000" stroke-width="1.2"/><text x="1195.0" y="1055" font-size="19" fill="#000000" text-anchor="middle" font-weight="600">Repeat runs do not create a second notification</text><text x="888" y="1080" font-size="15" fill="#000000" text-anchor="start" font-weight="400">Unique student/section record + persisted delivery state</text><text x="888" y="1100" font-size="15" fill="#000000" text-anchor="start" font-weight="400">Runner is independent from the web container lifecycle</text></g><g class="node" data-title="Acceptance boundary" data-x="870" data-y="1180" data-w="650" data-h="107"><rect x="870" y="1180" width="650" height="107" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><path d="M870 1215H1520" fill="none" stroke="#000000" stroke-width="1.2"/><text x="1195.0" y="1205" font-size="17" fill="#000000" text-anchor="middle" font-weight="600">Acceptance boundary</text><text x="888" y="1230" font-size="14" fill="#000000" text-anchor="start" font-weight="400">The workflow definition exists; protected secrets, scheduled execution</text><text x="888" y="1250" font-size="14" fill="#000000" text-anchor="start" font-weight="400">and actual test-account receipt still require separate live evidence.</text></g><rect x="180.5" y="451" width="91.0" height="22" fill="#ffffff"/><text x="226" y="466" font-size="12" fill="#000000" text-anchor="middle" font-weight="400">No consent</text><rect x="558.15" y="451" width="83.7" height="22" fill="#ffffff"/><text x="600" y="466" font-size="12" fill="#000000" text-anchor="middle" font-weight="400">Consented</text><rect x="512.35" y="642" width="171.29999999999998" height="22" fill="#ffffff"/><text x="598" y="657" font-size="12" fill="#000000" text-anchor="middle" font-weight="400">After acknowledgement</text><text x="48" y="1380" font-size="12" fill="#000000" text-anchor="start" font-weight="400">LINE messages / events | Durable state | Verification / consent | External scheduler</text><text x="48" y="1433" font-size="12" fill="#000000" text-anchor="start" font-weight="400">Implementation baseline 639686b | Migrations 001-006 | Prepared 01 November 2026</text><text x="1552" y="1433" font-size="12" fill="#000000" text-anchor="end" font-weight="400">08 / 11</text></svg>