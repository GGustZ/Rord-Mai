<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1420" role="img" aria-labelledby="title-supporting-erd desc-supporting-erd" style="font-family:Arial, Helvetica, sans-serif"><title id="title-supporting-erd">Supporting entity-relationship diagram</title><desc id="desc-supporting-erd">Supporting ERD adds five tables and the seven remaining foreign keys, using students and sections as reference anchors. Together Figures 2 and 3 cover 12 physical tables, 89 columns and 15 foreign keys. Private records cascade; shared creator/actor attribution becomes null.</desc><defs><marker id="arrow-supporting-erd-front" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#000000"/></marker><marker id="arrow-supporting-erd-back" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#000000"/></marker><marker id="arrow-supporting-erd-db" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#000000"/></marker><marker id="arrow-supporting-erd-cloud" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#000000"/></marker><marker id="arrow-supporting-erd-security" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#000000"/></marker><marker id="arrow-supporting-erd-bus" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#000000"/></marker><marker id="arrow-supporting-erd-external" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#000000"/></marker></defs><rect width="1600" height="1420" fill="#ffffff"/><text x="48" y="48" font-size="14" fill="#000000" text-anchor="start" font-weight="600">RORD-MAI / FIGURE 03</text><text x="48" y="89" font-size="30" fill="#000000" text-anchor="start" font-weight="600">Supporting entity-relationship diagram</text><text x="48" y="119" font-size="14" fill="#000000" text-anchor="start" font-weight="400">Consent evidence, deletion behaviour, asynchronous processing and schema bookkeeping.</text><polyline points="225,500 225,282" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" stroke-dasharray="none" marker-end="url(#arrow-supporting-erd-db)"/><polyline points="480,560 450,560 450,314 340,314 340,282" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" stroke-dasharray="none" marker-end="url(#arrow-supporting-erd-db)"/><polyline points="600,930 600,850 30,850 30,235 50,235" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" stroke-dasharray="none" marker-end="url(#arrow-supporting-erd-db)"/><polyline points="930,930 990,930 990,314 1390,314 1390,282" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" stroke-dasharray="none" marker-end="url(#arrow-supporting-erd-db)"/><polyline points="1290,500 1290,282" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" stroke-dasharray="none" marker-end="url(#arrow-supporting-erd-db)"/><polyline points="1070,615 1020,615 1020,374 160,374 160,282" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" stroke-dasharray="6 5" marker-end="url(#arrow-supporting-erd-db)"/><polyline points="1150,230 1040,230 1040,158 380,158 380,175" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" stroke-dasharray="6 5" marker-end="url(#arrow-supporting-erd-db)"/><g class="node entity" data-table="students" data-reference="true" data-title="students" data-x="50" data-y="175" data-w="370" data-h="107"><rect x="50" y="175" width="370" height="107" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><path d="M50 218H420" stroke="#000000" stroke-width="1.2"/><text x="235.0" y="203" font-size="18" fill="#000000" text-anchor="middle" font-weight="600">students</text><text x="66" y="243" font-size="14" fill="#000000" text-anch