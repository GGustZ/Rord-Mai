06" font-size="14" fill="#000000" text-anchor="start" font-weight="400">created_at: timestamptz</text></g><g class="node entity" data-table="deadline_notifications" data-reference="false" data-title="deadline_notifications" data-x="480" data-y="930" data-w="480" data-h="268"><rect x="480" y="930" width="480" height="268" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><path d="M480 973H960" stroke="#000000" stroke-width="1.2"/><text x="720.0" y="958" font-size="18" fill="#000000" text-anchor="middle" font-weight="600">deadline_notifications</text><text x="496" y="998" font-size="14" fill="#000000" text-anchor="start" font-weight="400">PK id: uuid</text><text x="496" y="1021" font-size="14" fill="#000000" text-anchor="start" font-weight="400">FK student_id: uuid</text><text x="496" y="1044" font-size="14" fill="#000000" text-anchor="start" font-weight="400">FK section_id: uuid</text><text x="496" y="1067" font-size="14" fill="#000000" text-anchor="start" font-weight="400">retry_key: uuid</text><text x="496" y="1090" font-size="14" fill="#000000" text-anchor="start" font-weight="400">message: text</text><text x="496" y="1113" font-size="14" fill="#000000" text-anchor="start" font-weight="400">attempts: int4</text><text x="496" y="1136" font-size="14" fill="#000000" text-anchor="start" font-weight="400">status: text</text><text x="496" y="1159" font-size="14" fill="#000000" text-anchor="start" font-weight="400">next_attempt_at: timestamptz</text><text x="496" y="1182" font-size="14" fill="#000000" text-anchor="start" font-weight="400">created_at: timestamptz</text></g><g class="node entity" data-table="schema_migrations" data-reference="false" data-title="schema_migrations" data-x="1070" data-y="1000" data-w="480" data-h="130"><rect x="1070" y="1000" width="480" height="130" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><path d="M1070 1043H1550" stroke="#000000" stroke-width="1.2"/><text x="1310.0" y="1028" font-size="18" fill="#000000" text-anchor="middle" font-weight="600">schema_migrations</text><text x="1086" y="1068" font-size="14" fill="#000000" text-anchor="start" font-weight="400">PK name: text</text><text x="1086" y="1091" font-size="14" fill="#000000" text-anchor="start" font-weight="400">checksum: text</text><text x="1086" y="1114" font-size="14" fill="#000000" text-anchor="start" font-weight="400">applied_at: timestamptz</text></g><g class="node" data-title="Consent lives on students" data-x="50" data-y="930" data-w="370" data-h="199"><rect x="50" y="930" width="370" height="199" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><path d="M50 965H420" fill="none" stroke="#000000" stroke-width="1.2"/><text x="235.0" y="955" font-size="17" fill="#000000" text-anchor="middle" font-weight="600">Consent lives on students</text><text x="68" y="980" font-size="14" fill="#000000" text-anchor="start" font-weight="400">storage_consent</text><text x="68" y="1000" font-size="14" fill="#000000" text-anchor="start" font-weight="400">storage_policy_version</text><text x="68" y="1020" font-size="14" fill="#000000" text-anchor="start" font-weight="400">storage_consented_at</text><text x="68" y="1040" font-size="14" fill="#000000" text-anchor="start" font-weight="400">cross_border_explanation</text><text x="68" y="1060" font-size="14" fill="#000000" text-anchor="start" font-weight="400">explanation_consented_at</text><text x="68" y="1080" font-size="14" fill="#000000" text-anchor="start" font-weight="400">External choice defaults off.</text></g><g class="node" data-title="Shared data survives deletion" data-x="1070" data-y="810" data-w="480" data-h="130"><rect x="1070" y="810" width="480" height="130" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><path d="M1070 845H1550" fill="none" stroke="#000000" stroke-width="1.2"/><text x="1310.0" y="835" font-size="17" fill="#000000" text-anchor="middle" font-weight="600">Shared data survives deletion</text><text x="1088" y="860" font-size="14" fill="#000000" text-anchor="start" font-weight="400">Deleting a student preserves sections and</text><text x="1088" y="880" font-size="14" fill="#000000" text-anchor="start" font-weight="400">grading revisions while creator_id and</text><text x="1088" y="900" font-size="14" fill="#000000" text-anchor="start" font-weight="400">actor_id become NULL. Private rows cascade.</text></g><g class="node" data-title="Short-lived processing" data-x="50" data-y="700" data-w="370" data-h="130"><rect x="50" y="700" width="370" height="130" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><path d="M50 735H420" fill="none" stroke="#000000" stroke-width="1.2"/><text x="235.0" y="725" font-size="17" fill="#000000" text-anchor="middle" font-weight="600">Short-lived processing</text><text x="68" y="750" font-size="14" fill="#000000" text-anchor="start" font-weight="400">conversation_state: 15-minute expiry</text><text x="68" y="770" font-size="14" fill="#000000" text-anchor="start" font-weight="400">private_jobs: five-minute event expiry</text><text x="68" y="790" font-size="14" fill="#000000" text-anchor="start" font-weight="400">Processed payloads are scrubbed.</text></g><g class="node" data-title="Integrity and lifecycle notes" data-x="480" data-y="1250" data-w="1070" data-h="107"><rect x="480" y="1250" width="1070" height="107" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><path d="M480 1285H1550" fill="none" stroke="#000000" stroke-width="1.2"/><text x="1015.0" y="1275" font-size="17" fill="#000000" text-anchor="middle" font-weight="600">Integrity and lifecycle notes</text><text x="498" y="1300" font-size="14" fill="#000000" text-anchor="start" font-weight="400">UNIQUE(event_id); UNIQUE(student_id, section_id) for notifications; UNIQUE(retry_key).</text><text x="498" y="1320" font-size="14" fill="#000000" text-anchor="start" font-weight="400">External consent requires storage consent. schema_migrations has no student relationships.</text></g><rect x="251.55" y="399"