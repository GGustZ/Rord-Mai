e Gemini</text></g><rect x="490.6" y="138" width="68.8" height="17" fill="#ffffff"/><text x="525" y="151" font-size="13" fill="#000000" text-anchor="middle" font-weight="400">ID token</text><rect x="380.55" y="185" width="288.9" height="17" fill="#ffffff"/><text x="525" y="198" font-size="13" fill="#000000" text-anchor="middle" font-weight="400">Consent choices / deletion confirmation</text><rect x="373.45000000000005" y="232" width="303.09999999999997" height="17" fill="#ffffff"/><text x="525" y="245" font-size="13" fill="#000000" text-anchor="middle" font-weight="400">Course / enrollment / academic entry data</text><rect x="419.6" y="279" width="210.79999999999998" height="17" fill="#ffffff"/><text x="525" y="292" font-size="13" fill="#000000" text-anchor="middle" font-weight="400">Calculation scenario request</text><rect x="469.3" y="326" width="111.39999999999999" height="17" fill="#ffffff"/><text x="525" y="339" font-size="13" fill="#000000" text-anchor="middle" font-weight="400">Syllabus image</text><rect x="451.55" y="373" width="146.9" height="17" fill="#ffffff"/><text x="525" y="386" font-size="13" fill="#000000" text-anchor="middle" font-weight="400">Explanation request</text><rect x="353.3" y="678" width="253.39999999999998" height="17" fill="#ffffff"/><text x="480" y="691" font-size="13" fill="#000000" text-anchor="middle" font-weight="400">Access / consent / deletion status</text><rect x="378.15" y="720" width="203.7" height="17" fill="#ffffff"/><text x="480" y="733" font-size="13" fill="#000000" text-anchor="middle" font-weight="400">Academic data / save status</text><rect x="363.95" y="762" width="232.1" height="17" fill="#ffffff"/><text x="480" y="775" font-size="13" fill="#000000" text-anchor="middle" font-weight="400">Calculated results / comparison</text><rect x="363.95" y="804" width="232.1" height="17" fill="#ffffff"/><text x="480" y="817" font-size="13" fill="#000000" text-anchor="middle" font-weight="400">OCR draft / validation warnings</text>