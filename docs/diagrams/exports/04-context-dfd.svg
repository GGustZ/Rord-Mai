<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-labelledby="title-context-dfd desc-context-dfd" style="font-family:Arial,Helvetica,sans-serif"><title id="title-context-dfd">Level-0 DFD / Context Diagram of Rord-Mai</title><desc id="desc-context-dfd">Level-0 context DFD in the reference monochrome style. Student, LINE and Gemini exchanges are balanced against Level 1. The context contains one system process and no internal store.</desc><defs><marker id="arrow-context-dfd" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><path d="M0 0L8 3.5L0 7Z" fill="#000000"/></marker></defs><rect width="1600" height="1200" fill="#ffffff"/><text x="48" y="49" font-size="28" fill="#000000" text-anchor="start" font-weight="600">Level-0 DFD / Context Diagram of Rord-Mai</text><text x="48" y="82" font-size="15" fill="#000000" text-anchor="start" font-weight="400">One system process and the data crossing its boundary. No internal data stores.</text><text x="48" y="1118" font-size="13" fill="#000000" text-anchor="start" font-weight="400">Notation: numbered rounded process | square external entity | open-ended data store | labelled data flow</text><text x="48" y="1143" font-size="13" fill="#000000" text-anchor="start" font-weight="400">Repeated entity names and D1 symbols refer to the same external entities or application data store.</text><text x="48" y="1172" font-size="12" fill="#000000" text-anchor="start" font-weight="400">Rord-Mai | Repository 639686b | Figure 4 | 01 November 2026</text><polyline points="100,510 100,160 950,160 950,500" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" marker-end="url(#arrow-context-dfd)"/><polyline points="129,510 129,207 905,207 905,500" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" marker-end="url(#arrow-context-dfd)"/><polyline points="158,510 158,254 860,254 860,500" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" marker-end="url(#arrow-context-dfd)"/><polyline points="187,510 187,301 815,301 815,500" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" marker-end="url(#arrow-context-dfd)"/><polyline points="216,510 216,348 770,348 770,500" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" marker-end="url(#arrow-context-dfd)"/><polyline points="245,510 245,395 725,395 725,500" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" marker-end="url(#arrow-context-dfd)"/><polyline points="690,620 690,700 265,700 265,610" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" marker-end="url(#arrow-context-dfd)"/><polyline points="738,620 738,742 233,742 233,610" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" marker-end="url(#arrow-context-dfd)"/><polyline points="786,620 786,784 201,784 201,610" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" marker-end="url(#arrow-context-dfd)"/><polyline points="834,620 834,826 169,826 169,610" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" marker-end="url(#arrow-context-dfd)"/><polyline points="882,620 882,868 137,868 137,610" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" marker-end="url(#arrow-context-dfd)"/><polyline points="980,526 1260,526" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" marker-end="url(#arrow-context-dfd)"/><polyline points="1260,563 980,563" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" marker-end="url(#arrow-context-dfd)"/><polyline points="1370,505 1370,455 965,455 965,500" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" marker-end="url(#arrow-context-dfd)"/><polyline points="980,603 1260,603" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" marker-end="url(#arrow-context-dfd)"/><polyline points="915,620 1080,620 1080,930 900,930 900,980" fill="n