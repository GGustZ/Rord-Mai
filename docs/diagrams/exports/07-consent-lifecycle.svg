<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1320" role="img" aria-labelledby="title-consent-lifecycle desc-consent-lifecycle" style="font-family:Arial, Helvetica, sans-serif"><title id="title-consent-lifecycle">Consent and data lifecycle</title><desc id="desc-consent-lifecycle">Consent lifecycle of the current implementation. Storage grant and optional external explanation consent are separate operations. External withdrawal preserves academic data; confirmed storage withdrawal or deletion removes private records and clears shared attribution. Provider records are outside database cascade scope.</desc><defs><marker id="arrow-consent-lifecycle-front" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#000000"/></marker><marker id="arrow-consent-lifecycle-back" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#000000"/></marker><marker id="arrow-consent-lifecycle-db" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#000000"/></marker><marker id="arrow-consent-lifecycle-cloud" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#000000"/></marker><marker id="arrow-consent-lifecycle-security" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#000000"/></marker><marker id="arrow-consent-lifecycle-bus" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#000000"/></marker><marker id="arrow-consent-lifecycle-external" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#000000"/></marker></defs><rect width="1600" height="1320" fill="#ffffff"/><text x="48" y="48" font-size="14" fill="#000000" text-anchor="start" font-weight="600">RORD-MAI / FIGURE 07</text><text x="48" y="89" font-size="30" fill="#000000" text-anchor="start" font-weight="600">Consent and data lifecycle</text><text x="48" y="119" font-size="14" fill="#000000" text-anchor="start" font-weight="400">Independent choices, bounded external processing, and confirmed private deletion.</text><rect x="40" y="165" width="730" height="840" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2" stroke-dasharray="8 5"/><text x="56" y="191" font-size="14" fill="#000000" text-anchor="start" font-weight="600">A  INDEPENDENT CONSENT AND EXPLANATIONS</text><rect x="830" y="165" width="730" height="840" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2" stroke-dasharray="8 5"/><text x="846" y="191" font-size="14" fill="#000000" text-anchor="start" font-weight="600">B  WITHDRAWAL AND DELETION</text><polyline points="405,320 405,375" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" stroke-dasharray="6 5" marker-end="url(#arrow-consent-lifecycle-security)"/><polyline points="260,470 260,530" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" stroke-dasharray="none" marker-end="url(#arrow-consent-lifecycle-back)"/><polyline points="590,470 590,530" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" stroke-dasharray="6 5" marker-end="url(#arrow-consent-lifecycle-security)"/><polyline points="590,635 590,705" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" stroke-dasharray="6 5" marker-end="url(#arrow-consent-lifecycle-security)"/><polyline points="590,810 590,865" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" stroke-dasharray="none" marker-end="url(#arrow-consent-lifecycle-back)"/><polyline points="220,635 220,865" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" stroke-dasharray="none" marker-end="url(#arrow-consent-lifecycle-back)"/><polyline points="1195,470 1195,535" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" stroke-dasharray="6 5" marker-end="url(#arrow-consent-lifecycle-security)"/><polyline points="1195,665 1195,730" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" stroke-dasharray="none" marker-end="url(#arrow-consent-lifecycle-db)"/><polyline points="1195,835 1195,890" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" stroke-dasharray="none" marker-end="url(#arrow-consent-lifecycle-back)"/><g class="node" data-title="Verified identity; no persistence yet" data-x="80" data-y="225" data-w="650" data-h="95"><rect x="80" y="225" width="650" height="95" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><path d="M80 260H730" fill="none" stroke="#000000" stroke-width="1.2"/><text x="405.0" y="250" font-size="19" fill="#000000" text-anchor="middle" font-weight="600">Verified identity; no persistence yet</text><text x="98" y="275" font-size="15" fill="#000000" text-anchor="start" font-weight="400">GET consent / login alone writes no student row</text><text x="98" y="295" font-size="15" fill="#000000" text-anchor="start" font-weight="400">Storage grant records current policy and timestamp</text></g><g class="node" data-title="Separate optional explanation choice" data-x="80" data-y="375" data-w="650" data-h="95"><rect x="80" y="375" width="650" height="95" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><path d="M80 410H730" fill="none" stroke="#000000" stroke-width="1.2"/><text x="405.0" y="400" font-size="19" fill="#000000" text-anchor="middle" font-weight="600">Separate optional explanation choice</text><text x="98" y="425" font-size="15" fill="#000000" text-anchor="start" font-weight="400">PUT /consents/cross-border-explanation</text><text x="98" y="445" font-size="15" fill="#000000" text-anchor="start" font-weight="400">External choice starts off; valid current evidence is required</text></g><g class="node" data-title="No external permission" data-x="80" data-y="530" data-w="280" data-h="105"><rect x="80" y="530" width="280" height="105" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><path d="M80 565H360" fill="none" stroke="#000000" stroke-width="1.2"/><text x="220.0" y="555" font-size="19" fill="#000000" text-anchor="middle" font-weight="600">No external permission</text><text x="98" y="580" font-size="14" fill="#000000" text-anchor="start" font-weight="400">Use local Thai template</text><text x="98" y="600" font-size="14" fill="#000000" text-anchor="start" font-weight="400">No request to Gemini</text></g><g class="node" data-title="External permission" data-x="450" data-y="530" data-w="280" data-h="105"><rect x="450" y="530" width="280" height="105" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><path d="M450 565H730" fill="none" stroke="#000000" stroke-width="1.2"/><text x="590.0" y="555" font-size="19" fill="#000000" text-anchor="middle" font-weight="600">External permission</text><text x="468" y="580" font-size="14" fill="#000000" text-anchor="start" font-weight="400">Build allowlisted payload</text><text x="468" y="600" font-size="14" fill="#000000" text-anchor="start" font-weight="400">kind / metrics / reasonCode</text></g><g class="node" data-title="Optional Gemini call" data-x="450" data-y="705" data-w="280" data-h="105"><rect x="450" y="705" width="280" height="105" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><path d="M450 740H730" fill="none" stroke="#000000" stroke-width="1.2"/><text x="590.0" y="730" font-size="19" fill="#000000" text-anchor="middle" font-weight="600">Optional Gemini call</text><text x="468" y="755" font-size="14" fill="#000000" text-anchor="start" font-weight="400">reachable also allowed</text><text x="468" y="775" font-size="14" fill="#000000" text-anchor="start" font-weight="400">No names, IDs or images</text></g><g class="node" data-title="Verified explanation or template" data-x="80" data-y="865" data-w="650" data-h="95"><rect x="80" y="865" width="650" height="95" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><path d="M80 900H730" fill="none" stroke="#000000" stroke-width="1.2"/><text x="405.0" y="890" font-size="19" fill="#000000" text-anchor="middle" font-weight="600">Verified explanation or template</text><text x="98" y="915" font-size="15" fill="#000000" text-anchor="start" font-weight="400">Reject literal generated numbers / unknown or missing placeholders</text><text x="98" y="935" font-size="15" fill="#000000" text-anchor="start" font-weight="400">Insert engine numbers; on timeout/error use local template</text></g><g class="node" data-title="Withdraw external consent only" data-x="870" data-y="225" data-w="650" data-h="95"><rect x="870" y="225" width="650" height="95" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><path d="M870 260H1520" fill="none" stroke="#000000" stroke-width="1.2"/><text x="1195.0" y="250" font-size="19" fill="#000000" text-anchor="middle" font-weight="600">Withdraw external consent only</text><text x="888" y="275" font-size="15" fill="#000000" text-anchor="start" font-weight="400">Set crossBorderExplanation=false independently</text><text x="888" y="295" font-size="15" fill="#000000" text-anchor="start" font-weight="400">Keep academic records; subsequent explanations use templates</text></g><g class="node" data-title="Withdraw storage / delete account" data-x="870" data-y="375" data-w="650" data-h="95"><rect x="870" y="375" width="650" height="95" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><path d="M870 410H1520" fill="none" stroke="#000000" stroke-width="1.2"/><text x="1195.0" y="400" font-size="19" fill="#000000" text-anchor="middle" font-weight="600">Withdraw storage / delete account</text><text x="888" y="425" font-size="15" fill="#000000" text-anchor="start" font-weight="400">Explicit confirmDeletion=true required</text><text x="888" y="445" font-size="15" fill="#000000" text-anchor="start" font-weight="400">Transaction locks the account and deletes the student row</text></g><g class="node" data-title="Private rows removed by cascades" data-x="870" data-y="535" data-w="650" data-h="130"><rect x="870" y="535" width="650" height="130" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><path d="M870 570H1520" fill="none" stroke="#000000" stroke-width="1.2"/><text x="1195.0" y="560" font-size="19" fill="#000000" text-anchor="middle" font-weight="600">Private rows removed by cascades</text><text x="888" y="585" font-size="15" fill="#000000" text-anchor="start" font-weight="400">Academic profile, enrollments, marks and attendance</text><text x="888" y="605" font-size="15" fill="#000000" text-anchor="start" font-weight="400">Conversation state, private jobs and notification records</text><text x="888" y="625" font-size="15" fill="#000000" text-anchor="start" font-weight="400">Both consent choices and account mapping are removed</text></g><g class="node" data-title="Shared structure retained" data-x="870" data-y="730" data-w="650" data-h="105"><rect x="870" y="730" width="650" height="105" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><path d="M870 765H1520" fill="none" stroke="#000000" stroke-width="1.2"/><text x="1195.0" y="755" font-size="19" fill="#000000" text-anchor="middle" font-weight="600">Shared structure retained</text><text x="888" y="780" font-size="15" fill="#000000" text-anchor="start" font-weight="400">Sections, components and grading revisions remain</text><text x="888" y="800" font-size="15" fill="#000000" text-anchor="start" font-weight="400">creator_id and actor_id become NULL</text></g><g class="node" data-title="Fresh consent needed to use private features again" data-x="870" data-y="890" data-w="650" data-h="70"><rect x="870" y="890" width="650" height="70" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><path d="M870 925H1520" fill="none" stroke="#000000" stroke-width="1.2"/><text x="1195.0" y="915" font-size="19" fill="#000000" text-anchor="middle" font-weight="600">Fresh consent needed to use private features again</text></g><g class="node" data-title="Policy change" data-x="40" data-y="1070" data-w="730" data-h="107"><rect x="40" y="1070" width="730" height="107" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><path d="M40 1105H770" fill="none" stroke="#000000" stroke-width="1.2"/><text x="405.0" y="1095" font-size="17" fill="#000000" text-anchor="middle" font-weight="600">Policy change</text><text x="58" y="1120" font-size="14" fill="#000000" text-anchor="start" font-weight="400">An old policy invalidates external consent. A repeated storage grant</text><text x="58" y="1140" font-size="14" fill="#000000" text-anchor="start" font-weight="400">under the same current policy preserves the separate external choice.</text></g><g class="node" data-title="Deletion boundary" data-x="830" data-y="1070" data-w="730" data-h="107"><rect x="830" y="1070" width="730" height="107" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><path d="M830 1105H1560" fill="none" stroke="#000000" stroke-width="1.2"/><text x="1195.0" y="1095" font-size="17" fill="#000000" text-anchor="middle" font-weight="600">Deletion boundary</text><text x="848" y="1120" font-size="14" fill="#000000" text-anchor="start" font-weight="400">Local deletion does not erase LINE, Gemini, host logs or backups.</text><text x="848" y="1140" font-size="14" fill="#000000" text-anchor="start" font-weight="400">Provider retention and backup handling require an operator policy.</text></g><rect x="195.95" y="499" width="142.1" height="22" fill="#ffffff"/><text x="267" y="514" font-size="12" fill="#000000" text-anchor="middle" font-weight="400">Off / unavailable</text><rect x="531.65" y="499" width="156.7" height="22" fill="#ffffff"/><text x="610" y="514" font-size="12" fill="#000000" text-anchor="middle" font-weight="400">On + current policy</text><rect x="519.65" y="665" width="156.7" height="22" fill="#ffffff"/><text x="598" y="680" font-size="12" fill="#000000" text-anchor="middle" font-weight="400">Aggregate-only data</text><rect x="1219.9" y="499" width="120.2" height="22" fill="#ffffff"/><text x="1280" y="514" font-size="12" fill="#000000" text-anchor="middle" font-weight="400">Confirmed only</text><text x="48" y="1240" font-size="12" fill="#000000" text-anchor="start" font-weight="400">Consent / confirmation | Database lifecycle | Local processing | External provider</text><text x="48" y="1283" font-size="12" fill="#000000" text-anchor="start" font-weight="400">Implementation baseline 639686b | Migrations 001-006 | Prepared 01 November 2026</text><text x="1552" y="1283" font-size="12" fill="#000000" text-anchor="end" font-weight="400">07 / 11</text></svg>