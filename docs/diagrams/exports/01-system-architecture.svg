<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1310" role="img" aria-labelledby="title-system-architecture desc-system-architecture" style="font-family:Arial, Helvetica, sans-serif"><title id="title-system-architecture">System architecture</title><desc id="desc-system-architecture">Four-layer architecture of the current repository. LIFF REST traffic reaches Express directly; LINE mediates identity and chat. Tesseract runs locally in the app container. Gemini is optional and consent-gated. GitHub Actions runs the separate deadline evaluator.</desc><defs><marker id="arrow-system-architecture-front" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#000000"/></marker><marker id="arrow-system-architecture-back" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#000000"/></marker><marker id="arrow-system-architecture-db" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#000000"/></marker><marker id="arrow-system-architecture-cloud" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#000000"/></marker><marker id="arrow-system-architecture-security" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#000000"/></marker><marker id="arrow-system-architecture-bus" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#000000"/></marker><marker id="arrow-system-architecture-external" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#000000"/></marker></defs><rect width="1600" height="1310" fill="#ffffff"/><text x="48" y="48" font-size="14" fill="#000000" text-anchor="start" font-weight="600">RORD-MAI / FIGURE 01</text><text x="48" y="89" font-size="30" fill="#000000" text-anchor="start" font-weight="600">System architecture</text><text x="48" y="119" font-size="14" fill="#000000" text-anchor="start" font-weight="400">Four logical layers, physical hosting, and external processing boundaries.</text><rect x="40" y="155" width="1180" height="145" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2" stroke-dasharray="8 5"/><text x="56" y="181" font-size="14" fill="#000000" text-anchor="start" font-weight="600">01  CLIENT LAYER</text><rect x="40" y="345" width="1180" height="150" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2" stroke-dasharray="8 5"/><text x="56" y="371" font-size="14" fill="#000000" text-anchor="start" font-weight="600">02  LINE PLATFORM</text><rect x="40" y="540" width="1180" height="390" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2" stroke-dasharray="8 5"/><text x="56" y="566" font-size="14" fill="#000000" text-anchor="start" font-weight="600">03  APPLICATION LAYER  /  Render Docker web service, Singapore</text><rect x="40" y="1000" width="1180" height="150" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2" stroke-dasharray="8 5"/><text x="56" y="1026" font-size="14" fill="#000000" text-anchor="start" font-weight="600">04  DATA LAYER  /  Render PostgreSQL, Singapore</text><polyline points="430,240 620,240 620,575 235,575 235,596" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" stroke-dasharray="none" marker-end="url(#arrow-system-architecture-front)"/><polyline points="1015,276 1015,393" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" stroke-dasharray="none" marker-end="url(#arrow-system-architecture-bus)"/><polyline points="80,626 25,626 25,482 255,482 255,469" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" stroke-dasharray="6 5" marker-end="url(#arrow-system-architecture-security)"/><polyline points="850,432 785,432 785,588 310,588 310,596" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" stroke-dasharray="6 5" marker-end="url(#arrow-system-architecture-security)"/><polyline points="390,638 440,638" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" stroke-dasharray="none" marker-end="url(#arrow-system-architecture-back)"/><polyline points="750,638 800,638" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" stroke-dasharray="none" marker-end="url(#arrow-system-architecture-back)"/><polyline points="140,682 140,770" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" stroke-dasharray="none" marker-end="url(#arrow-system-architecture-back)"/><polyline points="550,682 550,770" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" stroke-dasharray="none" marker-end="url(#arrow-system-architecture-back)"/><polyline points="1010,770 1010,711 1188,711 1188,483 1080,483 1080,469" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" stroke-dasharray="none" marker-end="url(#arrow-system-architecture-bus)"/><polyline points="750,820 770,820 770,900 1260,900 1260,820 1280,820" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" stroke-dasharray="6 5" marker-end="url(#arrow-system-architecture-security)"/><polyline points="1280,845 1250,845 1250,940 600,940 600,870" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" stroke-dasharray="none" marker-end="url(#arrow-system-architecture-external)"/><polyline points="680,682 780,682 780,968 630,968 630,1051" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" stroke-dasharray="none" marker-end="url(#arrow-system-architecture-db)"/><polyline points="990,870 990,1051" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" stroke-dasharray="none" marker-end="url(#arrow-system-architecture-db)"/><polyline points="1280,1080 1180,1080" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" stroke-dasharray="none" marker-end="url(#arrow-system-architecture-db)"/><polyline points="155