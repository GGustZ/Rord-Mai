" fill="none" stroke="#000000" stroke-width="1.2"/><text x="1015.0" y="418" font-size="19" fill="#000000" text-anchor="middle" font-weight="600">LINE Messaging API</text><text x="868" y="443" font-size="14" fill="#000000" text-anchor="start" font-weight="400">Signed webhook, reply, push</text></g><g class="node" data-title="Express REST API" data-x="80" data-y="596" data-w="310" data-h="86"><rect x="80" y="596" width="310" height="86" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><path d="M80 631H390" fill="none" stroke="#000000" stroke-width="1.2"/><text x="235.0" y="621" font-size="19" fill="#000000" text-anchor="middle" font-weight="600">Express REST API</text><text x="98" y="646" font-size="14" fill="#000000" text-anchor="start" font-weight="400">Verify identity and ownership</text><text x="98" y="666" font-size="14" fill="#000000" text-anchor="start" font-weight="400">Validate request boundaries</text></g><g class="node" data-title="Academic services" data-x="440" data-y="596" data-w="310" data-h="86"><rect x="440" y="596" width="310" height="86" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><path d="M440 631H750" fill="none" stroke="#000000" stroke-width="1.2"/><text x="595.0" y="621" font-size="19" fill="#000000" text-anchor="middle" font-weight="600">Academic services</text><text x="458" y="646" font-size="14" fill="#000000" text-anchor="start" font-weight="400">Consent-locked transactions</text><text x="458" y="666" font-size="14" fill="#000000" text-anchor="start" font-weight="400">Private entries; shared structure</text></g><g class="node" data-title="Pure calculation engine" data-x="800" data-y="596" data-w="380" data-h="86"><rect x="800" y="596" width="380" height="86" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><path d="M800 631H1180" fill="none" stroke="#000000" stroke-width="1.2"/><text x="990.0" y="621" font-size="19" fill="#000000" text-anchor="middle" font-weight="600">Pure calculation engine</text><text x="818" y="646" font-size="14" fill="#000000" text-anchor="start" font-weight="400">Weighted scores, targets, GPAX</text><text x="818" y="666" font-size="14" fill="#000000" text-anchor="start" font-weight="400">Delta = withdrawal minus staying</text></g><g class="node" data-title="Local Tesseract" data-x="80" data-y="770" data-w="310" data-h="100"><rect x="80" y="770" width="310" height="100" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><path d="M80 805H390" fill="none" stroke="#000000" stroke-width="1.2"/><text x="235.0" y="795" font-size="19" fill="#000000" text-anchor="middle" font-weight="600">Local Tesseract</text><text x="98" y="820" font-size="14" fill="#000000" text-anchor="start" font-weight="400">Thai + English image processing</text><text x="98" y="840" font-size="14" fill="#000000" text-anchor="start" font-weight="400">Editable draft; temporary image</text><text x="98" y="860" font-size="14" fill="#000000" text-anchor="start" font-weight="400">No external OCR service</text></g><g class="node" data-title="Explanations" data-x="440" data-y="770" data-w="310" data-h="100"><rect x="440" y="770" width="310" height="100" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><path d="M440 805H750" fill="none" stroke="#000000" stroke-width="1.2"/><text x="595.0" y="795" font-size="19" fill="#000000" text-anchor="middle" font-weight="600">Explanations</text><text x="458" y="820" font-size="14" fill="#000000" text-anchor="start" font-weight="400">Thai template is always available</text><text x="458" y="840" font-size="14" fill="#000000" text-anchor="start" font-weight="400">Allowlisted aggregate metrics</text><text x="458" y="860" font-size="14" fill="#000000" text-anchor="start" font-weight="400">Verify model numeric placeholders</text></g><g class="node" data-title="Durable chat worker" data-x="800" data-y="770" data-w="380" data-h="100"><rect x="800" y="770" width="380" height="100" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><path d="M800 805H1180" fill="none" stroke="#000000" stroke-width="1.2"/><text x="990.0" y="795" font-size="19" fill="#000000" text-anchor="middle" font-weight="600">Durable chat worker</text><text x="818" y="820" font-size="14" fill="#000000" text-anchor="start" font-weight="400">PostgreSQL queue and short state</text><text x="818" y="840" font-size="14" fill="#000000" text-anchor="start" font-weight="400">Commit acceptance before HTTP 200</text><text x="818" y="860" font-size="14" fill="#000000" text-anchor="start" font-weight="400">Process and reply asynchronously</text></g><g class="node" data-title="PostgreSQL 18" data-x="80" data-y="1051" data-w="1100" data-h="75"><rect x="80" y="1051" width="1100" height="75" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><path d="M80 1086H1180" fill="none" stroke="#000000" stroke-width="1.2"/><text x="630.0" y="1076" font-size="19" fill="#000000" text-anchor="middle" font-weight="600">PostgreSQL 18</text><text x="98" y="1101" font-size="15" fill="#000000" text-anchor="start" font-weight="400">Shared course structure | Private profiles, enrollments, marks, consent, jobs and notification records</text></g><g class="node" data-title="Google Gemini" data-x="1280" data-y="770" data-w="275" data-h="100"><rect x="1280" y="770" width="275" height="100" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><path d="M1280 805H1555" fill="none" stroke="#000000" stroke-width="1.2"/><text x="1417.5" y="795" font-size="19" fill="#000000" text-anchor="middle" font-weight="600">Google Gemini</text><text x="1298" y="820" font-size="14" fill="#000000" text-anchor="start" font-weight="400">Optional external provider</text><text x="1298" y="840" font-size="14" fill="#000000" text-anchor="start" font-weight="400">Current separate consent</text><text x="1298" y="860" font-size="14" fill="#000000" text-anchor="start" font-weight="400">Aggregate results only</text></g><g class="node" data-title="GitHub Actions" data-x="1280" data-y="1