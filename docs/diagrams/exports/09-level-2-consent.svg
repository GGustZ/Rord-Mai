<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1370" role="img" aria-labelledby="title-level-2-consent desc-level-2-consent" style="font-family:Arial,Helvetica,sans-serif"><title id="title-level-2-consent">Level-2 DFD for Process 2.0: Manage Consent</title><desc id="desc-level-2-consent">Level-2 decomposition of consent and confirmed private deletion. Child interfaces preserve the Student consent request/status and D1 account query, snapshot and update flows of parent 2.0. Deletion is rooted at students; database cascades remove private records and clear shared attribution.</desc><defs><marker id="arrow-level-2-consent" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><path d="M0 0L8 3.5L0 7Z" fill="#000000"/></marker></defs><rect width="1600" height="1370" fill="#ffffff"/><text x="48" y="49" font-size="28" fill="#000000" text-anchor="start" font-weight="600">Level-2 DFD for Process 2.0: Manage Consent</text><text x="48" y="82" font-size="15" fill="#000000" text-anchor="start" font-weight="400">Parent process 2.0 is expanded into 2.1-2.6 without changing its external data contract.</text><text x="48" y="1288" font-size="13" fill="#000000" text-anchor="start" font-weight="400">Notation: numbered rounded process | square external entity | open-ended data store | labelled data flow</text><text x="48" y="1313" font-size="13" fill="#000000" text-anchor="start" font-weight="400">Repeated entity names and D1 symbols refer to the same external entities or application data store.</text><text x="48" y="1342" font-size="12" fill="#000000" text-anchor="start" font-weight="400">Rord-Mai | Repository 639686b | Figure 9 | 01 November 2026</text><polyline points="320,245 460,245" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" marker-end="url(#arrow-level-2-consent)"/><polyline points="460,285 320,285" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" marker-end="url(#arrow-level-2-consent)"/><polyline poi