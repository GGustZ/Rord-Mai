<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1450" role="img" aria-labelledby="title-level-2-calculations desc-level-2-calculations" style="font-family:Arial,Helvetica,sans-serif"><title id="title-level-2-calculations">Level-2 DFD for Process 4.0: Calculate Results</title><desc id="desc-level-2-calculations">Level-2 calculation decomposition. Owned inputs produce weighted summaries, required target scores, and permitted ordinary stay/withdraw GPAX scenarios. Repeated-course GPAX emits REPEAT_RULE_UNVERIFIED rather than fabricated replacement arithmetic. Child boundary flows match process 4.0.</desc><defs><marker id="arrow-level-2-calculations" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><path d="M0 0L8 3.5L0 7Z" fill="#000000"/></marker></defs><rect width="1600" height="1450" fill="#ffffff"/><text x="48" y="49" font-size="28" fill="#000000" text-anchor="start" font-weight="600">Level-2 DFD for Process 4.0: Calculate Results</text><text x="48" y="82" font-size="15" fill="#000000" text-anchor="start" font-weight="400">Parent process 4.0 is expanded into 4.1-4.6; pure arithmetic remains inside the calculation service.</text><text x="48" y="1368" font-size="13" fill="#000000" text-anchor="start" font-weight="400">Notation: numbered rounded process | square external entity | open-ended data store | labelled data flow</text><text x="48" y="1393" font-size="13" fill="#000000" text-anchor="start" font-weight="400">Repeated entity names and D1 symbols refer to the same external entities or application data store.</text><text x="48" y="1422" font-size="12" fill="#000000" text-anchor="start" font-weight="400">Rord-Mai | Repository 639686b | Figure 10 | 01 November 2026</text><polyline points="320,275 460,275" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" marker-end="url(#arrow-level-2-calculations)"/><polyline points="800,260 1130,260" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" marker-end="url(#arrow-level-2-calculations)"/><polyline points="1130,310 800,310" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" marker-end="url(#arrow-level-2-calculations)"/><polyline points="560,335 560,435 335,435 335,530" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" marker-end="url(#arrow-level-2-calculations)"/><polyline points="800,285 970,285 970,455 1205,455 1205,530" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" marker-end="url(#arrow-level-2-calculations)"/><polyline points="335,645 335,800" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" marker-end="url(#arrow-level-2-calculations)"/><polyline points="160,585 90,585 90,1035 690,1035 690,1100" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" marker-end="url(#arrow-level-2-calculations)"/><polyline points="510,855 545,855 545,1185 580,1185" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" marker-end="url(#arrow-level-2-calculations)"/><polyline points="1205,645 1205,800" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" marker-end="url(#arrow-level-2-calculations)"/><polyline points="1400,585 1490,585 1490,1030 930,1030 930,1100" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" marker-end="url(#arrow-level-2-calculations)"/><polyline points="1010,855 970,855 970,1000 850,1000 850,1100" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" marker-end="url(#arrow-level-2-calculations)"/><polyline points="580,1155 320,1155" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" marker-end="url(#arrow-level-2-calculations)"/><g class="node dfd-entity" data-title="E1 Student" data-x="60" data-y="245" data-w="260" data-h="80"><rect x="60" y="245" width="260" height="80" fill="#ffffff"/><rect x="60" y="245" width="260" height="80" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><te