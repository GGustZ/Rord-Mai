" width="440" height="115" rx="10" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><path d="M580 1130H1020" stroke="#000000"/><text x="800.0" y="1121" font-size="16" fill="#000000" text-anchor="middle" font-weight="400">4.6</text><text x="800.0" y="1155" font-size="17" fill="#000000" text-anchor="middle" font-weight="400">Assemble calculation results and error</text><text x="800.0" y="1176" font-size="17" fill="#000000" text-anchor="middle" font-weight="400">outcomes</text></g><g class="node dfd-entity" data-title="E1 Student" data-x="60" data-y="1120" data-w="260" data-h="80"><rect x="60" y="1120" width="260" height="80" fill="#ffffff"/><rect x="60" y="1120" width="260" height="80" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><text x="190.0" y="1166.0" font-size="17" fill="#000000" text-anchor="middle" font-weight="400">Student</text></g><rect x="313.0" y="189" width="154.0" height="17" fill="#ffffff"/><text x="390" y="202" font-size="13" fill="#000000" text-anchor="middle" font-weight="400">Calculation scenario</text><rect x="359.15" y="206" width="61.699999999999996" height="17" fill="#ffffff"/><text x="390" y="219" font-size="13" fill="#000000" text-anchor="middle" font-weight="400">request</text><rect x="877.35" y="229" width="175.29999999999998" height="17" fill="#ffffff"/><text x="965" y="242" font-size="13" fill="#000000" text-anchor="middle" font-weight="400">Owned calculation query</text><rect x="841.85" y="343" width="246.29999999999998" height="17" fill="#ffffff"/><text x="965" y="356" font-size="13" fill="#000000" text-anchor="middle" font-weight="400">Owned rules / entries / profile /</text><rect x="937.7" y="360" width="54.599999999999994" height="17" fill="#ffffff"/><text x="965" y="373" font-size="13" fill="#000000" text-anchor="middle" font-weight="400">target</text><rect x="277.35" y="411" width="175.29999999999998" height="17" fill="#ffffff"/><text x="365" y="424" font-size="13" fill="#000000" text-anchor="middle" font-weight="400">Owned assessment inputs</text><rect x="1094.6" y="428" width="210.79999999999998" height="17" fill="#ffffff"/><text x="1200" y="441" font-size="13" fill="#000000" text-anchor="middle" font-weight="400">Owned GPA inputs / scenarios</text><rect x="295.25" y="691" width="189.5" height="17" fill="#ffffff"/><text x="390" y="704" font-size="13" fill="#000000" text-anchor="middle" font-weight="400">Weighted score / target /</text><rect x="334.3" y="708" width="111.39999999999999" height="17" fill="#ffffff"/><text x="390" y="721" font-size="13" fill="#000000" text-anchor="middle" font-weight="400">remaining work</text><rect x="272.2" y="1009" width="125.6" height="17" fill="#ffffff"/><text x="335" y="1022" font-size="13" fill="#000000" text-anchor="middle" font-weight="400">Weighted summary</text><rect x="382.2" y="987" width="125.6" height="17" fill="#ffffff"/><text x="445" y="1000" font-size="13" fill="#000000" text-anchor="middle" font-weight="400">Required score /</text><rect x="399.95" y="1004" width="90.1" height="17" fill="#ffffff"/><text x="445" y="1017" font-size="13" fill="#000000" text-anchor="middle" font-weight="400">feasibility</text><rect x="1134.6" y="697" width="210.79999999999998" height="17" fill="#ffffff"/><text x="1240" y="710" font-size="13" fill="#000000" text-anchor="middle" font-weight="400">Permitted ordinary scenarios</text><rect x="1270.9" y="999" width="168.2" height="17" fill="#ffffff"/><text x="1355" y="1012" font-size="13" fill="#000000" text-anchor="middle" font-weight="400">REPEAT_RULE_UNVERIFIED</text><rect x="965.25" y="965" width="189.5" height="17" fill="#ffffff"/><text x="1060" y="978" font-size="13" fill="#000000" text-anchor="middle" font-weight="400">GPAX pair / numeric delta</text><rect x="351.7" y="1105" width="196.6" height="17" fill="#ffffff"/><text x="450" y="1118" font-size="13" fill="#000000" text-anchor="middle" font-weight="400">Summary / required score /</text><rect x="397.85" y="1122" width="104.3" height="17" fill="#ffffff"/><text x="450" y="1135" font-size="13" fill="#000000" text-anchor="middle" font-weight="400">GPAX or error</text><text x="60" y="1300" font-size="14" fill="#000000" text-anchor="start" font-weight="400">The service loads data; the pure engine has no database I/O. Delta = withdrawal GPAX minus staying GPAX.</text><text x="60" y="1325" font-size="14" fill="#000000" text-anchor="start" font-weight="400">Norm-referenced targets and zero-denominator GPAX are returned as unavailable/error outcomes, not invented numeric results.</text></svg>