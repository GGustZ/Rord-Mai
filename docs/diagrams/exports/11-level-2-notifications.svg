<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1430" role="img" aria-labelledby="title-level-2-notifications desc-level-2-notifications" style="font-family:Arial,Helvetica,sans-serif"><title id="title-level-2-notifications">Level-2 DFD for Process 8.0: Deadline Notifications</title><desc id="desc-level-2-notifications">Level-2 notification decomposition. Current course, consent and delivery data produce eligible persisted notifications, a bounded LINE push and delivery-state updates. Existing retry keys are reused; no second notification is created for the same student/section. Interfaces balance with process 8.0.</desc><defs><marker id="arrow-level-2-notifications" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><path d="M0 0L8 3.5L0 7Z" fill="#000000"/></marker></defs><rect width="1600" height="1430" fill="#ffffff"/><text x="48" y="49" font-size="28" fill="#000000" text-anchor="start" font-weight="600">Level-2 DFD for Process 8.0: Deadline Notifications</text><text x="48" y="82" font-size="15" fill="#000000" text-anchor="start" font-weight="400">Parent process 8.0 is expanded into 8.1-8.5; a schedule triggers execution, not a DFD control arrow.</text><text x="48" y="1348" font-size="13" fill="#000000" text-anchor="start" font-weight="400">Notation: numbered rounded process | square external entity | open-ended data store | labelled data flow</text><text x="48" y="1373" font-size="13" fill="#000000" text-anchor="start" font-weight="400">Repeated entity names and D1 symbols refer to the same external entities or application data store.</text><text x="48" y="1402" font-size="12" fill="#000000" text-anchor="start" font-weight="400">Rord-Mai | Repository 639686b | Figure 11 | 01 November 2026</text><polyline points="770,245 1160,245" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" marker-end="url(#arrow-level-2-notifications)"/><polyline points="1160,295 770,295" fill="none" stroke="#000000" stroke-width="1.25" str