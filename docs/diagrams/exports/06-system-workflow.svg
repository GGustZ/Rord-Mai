<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1410" role="img" aria-labelledby="title-system-workflow desc-system-workflow" style="font-family:Arial, Helvetica, sans-serif"><title id="title-system-workflow">System workflow</title><desc id="desc-system-workflow">Student workflow from LINE authentication through independent consent, shared section setup, private entry and comparison. OCR drafts require review. Norm-referenced grade estimates and repeated-course GPAX are explicitly restricted; failures preserve a manual or template path.</desc><defs><marker id="arrow-system-workflow-front" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#000000"/></marker><marker id="arrow-system-workflow-back" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#000000"/></marker><marker id="arrow-system-workflow-db" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#000000"/></marker><marker id="arrow-system-workflow-cloud" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#000000"/></marker><marker id="arrow-system-workflow-security" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#000000"/></marker><marker id="arrow-system-workflow-bus" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#000000"/></marker><marker id="arrow-system-workflow-external" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#000000"/></marker></defs><rect width="1600" height="1410" fill="#ffffff"/><text x="48" y="48" font-size="14" fill="#000000" text-anchor="start" font-weight="600">RORD-MAI / FIGURE 06</text><text x="48" y="89" font-size="30" fill="#000000" text-anchor="start" font-weight="600">System workflow</text><text x="48" y="119" font-size="14" fill="#000000" text-anchor="start" font-weight="400">Main student journey, with validation loops and safe alternatives.</text><polyline points="800,240 800,290" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" stroke-dasharray="6 5" marker-end="url(#arrow-system-workflow-security)"/><polyline points="800,385 800,440" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" stroke-dasharray="6 5" marker-end="url(#arrow-system-workflow-security)"/><polyline points="800,535 800,590" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" stroke-dasharray="none" marker-end="url(#arrow-system-workflow-back)"/><polyline points="580,628 415,628" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" stroke-dasharray="none" marker-end="url(#arrow-system-workflow-back)"/><polyline points="1020,628 1185,628" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" stroke-dasharray="none" marker-end="url(#arrow-system-workflow-front)"/><polyline points="240,740 240,842 580,842" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" stroke-dasharray="none" marker-end="url(#arrow-system-workflow-back)"/><polyline points="1360,695 1360,842 1020,842" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" stroke-dasharray="none" marker-end="url(#arrow-system-workflow-back)"/><polyline points="800,890 800,950" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" stroke-dasharray="none" marker-end="url(#arrow-system-workflow-back)"/><polyline points="800,1045 800,1100" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" stroke-dasharray="none" marker-end="url(#arrow-system-workflow-back)"/><polyline points="580,338 415,338" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" stroke-dasharray="6 5" marker-end="url(#arrow-system-workflow-security)"/><g class="node" data-title="Open LIFF / LINE login" data-x="580" data-y="165" data-w="440" data-h="75"><rect x="580" y="165" width="440" height="75" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><path d="M580 200H1020" fill="none" stroke="#000000" stroke-width="1.2"/><text x="800.0" y="190" font-size="19" fill="#000000" text-anchor="middle" font-weight="600">Open LIFF / LINE login</text><text x="598" y="215" font-size="15" fill="#000000" text-anchor="start" font-weight="400">Backend verifies the provider ID token</text></g><g class="node" data-title="Storage consent?" data-x="580" data-y="290" data-w="440" data-h="95"><rect x="580" y="290" width="440" height="95" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><path d="M580 325H1020" fill="none" stroke="#000000" stroke-width="1.2"/><text x="800.0" y="315" font-size="19" fill="#000000" text-anchor="middle" font-weight="600">Storage consent?</text><text x="598" y="340" font-size="15" fill="#000000" text-anchor="start" font-weight="400">Accept current policy to store private data</text><text x="598" y="360" font-size="15" fill="#000000" text-anchor="start" font-weight="400">Decline -&gt; no private academic persistence</text></g><g class="node" data-title="Optional external consent" data-x="580" data-y="440" data-w="440" data-h="95"><rect x="580" y="440" width="440" height="95" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><path d="M580 475H1020" fill="none" stroke="#000000" stroke-width="1.2"/><text x="800.0" y="465" font-size="19" fill="#000000" text-anchor="middle" font-weight="600">Optional external consent</text><text x="598" y="490" font-size="15" fill="#000000" text-anchor="start" font-weight="400">Separate second screen; defaults off</text><text x="598" y="510" font-size="15" fill="#000000" text-anchor="start" font-weight="400">Decline -&gt; local explanations remain available</text></g><g class="node" data-title="Create or join a section" data-x="580" data-y="590" data-w="440" data-h="75"><rect x="580" y="590" width="440" height="75" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><path d="M580 625H1020" fill="none" stroke="#000000" stroke-width="1.2"/><text x="800.0" y="615" font-size="19" fill="#000000" text-anchor="middle" font-weight="600">Create or join a section</text><text x="598" y="640" font-size="15" fill="#000000" text-anchor="start" font-weight="400">Creator defines rules; joiner reuses them</text></g><g class="node" data-title="Create: manual or OCR" data-x="65" data-y="590" data-w="350" data-h="150"><rect x="65" y="590" width="350" height="150" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><path d="M65 625H415" fill="none" stroke="#000000" stroke-width="1.2"/><text x="240.0" y="615" font-size="19" fill="#000000" text-anchor="middle" font-weight="600">Create: manual or OCR</text><text x="83" y="640" font-size="14" fill="#000000" text-anchor="start" font-weight="400">Validated PNG/JPEG -&gt; local OCR</text><text x="83" y="660" font-size="14" fill="#000000" text-anchor="start" font-weight="400">Review and correct the draft</text><text x="83" y="680" font-size="14" fill="#000000" text-anchor="start" font-weight="400">Confirm all components and types</text><text x="83" y="700" font-size="14" fill="#000000" text-anchor="start" font-weight="400">Weights must total exactly 100%</text></g><g class="node" data-title="Join: six-character code" data-x="1185" data-y="590" data-w="350" data-h="105"><rect x="1185" y="590" width="350" height="105" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><path d="M1185 625H1535" fill="none" stroke="#000000" stroke-width="1.2"/><text x="1360.0" y="615" font-size="19" fill="#000000" text-anchor="middle" font-weight="600">Join: six-character code</text><text x="1203" y="640" font-size="14" fill="#000000" text-anchor="start" font-weight="400">Validate code and existing section</text><text x="1203" y="660" font-size="14" fill="#000000" text-anchor="start" font-weight="400">Invalid -&gt; show error and retry</text></g><g class="node" data-title="Record private academic inputs" data-x="580" data-y="795" data-w="440" data-h="95"><rect x="580" y="795" width="440" height="95" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><path d="M580 830H1020" fill="none" stroke="#000000" stroke-width="1.2"/><text x="800.0" y="820" font-size="19" fill="#000000" text-anchor="middle" font-weight="600">Record private academic inputs</text><text x="598" y="845" font-size="15" fill="#000000" text-anchor="start" font-weight="400">Marks, attendance, target, GPA and credits</text><text x="598" y="865" font-size="15" fill="#000000" text-anchor="start" font-weight="400">Validate ownership, type, bounds and revision</text></g><g class="node" data-title="Calculate and compare" data-x="580" data-y="950" data-w="440" data-h="95"><rect x="580" y="950" width="440" height="95" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><path d="M580 985H1020" fill="none" stroke="#000000" stroke-width="1.2"/><text x="800.0" y="975" font-size="19" fill="#000000" text-anchor="middle" font-weight="600">Calculate and compare</text><text x="598" y="1000" font-size="15" fill="#000000" text-anchor="start" font-weight="400">Weighted summary and required score</text><text x="598" y="1020" font-size="15" fill="#000000" text-anchor="start" font-weight="400">Stay / withdraw GPAX + visible numeric delta</text></g><g class="node" data-title="Display results and explanation" data-x="580" data-y="1100" data-w="440" data-h="95"><rect x="580" y="1100" width="440" height="95" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><path d="M580 1135H1020" fill="none" stroke="#000000" stroke-width="1.2"/><text x="800.0" y="1125" font-size="19" fill="#000000" text-anchor="middle" font-weight="600">Display results and explanation</text><text x="598" y="1150" font-size="15" fill="#000000" text-anchor="start" font-weight="400">Non-GPAX considerations + disclaimer</text><text x="598" y="1170" font-size="15" fill="#000000" text-anchor="start" font-weight="400">Template or verified optional Gemini text</text></g><g class="node" data-title="Declined / invalid login" data-x="65" data-y="290" data-w="350" data-h="95"><rect x="65" y="290" width="350" height="95" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><path d="M65 325H415" fill="none" stroke="#000000" stroke-width="1.2"/><text x="240.0" y="315" font-size="19" fill="#000000" text-anchor="middle" font-weight="600">Declined / invalid login</text><text x="83" y="340" font-size="14" fill="#000000" text-anchor="start" font-weight="400">No private account on login alone</text><text x="83" y="360" font-size="14" fill="#000000" text-anchor="start" font-weight="400">Retry sign-in or review consent</text></g><g class="node" data-title="Calculation restrictions" data-x="65" data-y="990" data-w="350" data-h="153"><rect x="65" y="990" width="350" height="153" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><path d="M65 1025H415" fill="none" stroke="#000000" stroke-width="1.2"/><text x="240.0" y="1015" font-size="17" fill="#000000" text-anchor="middle" font-weight="600">Calculation restrictions</text><text x="83" y="1040" font-size="14" fill="#000000" text-anchor="start" font-weight="400">Norm mode: no letter-grade target.</text><text x="83" y="1060" font-size="14" fill="#000000" text-anchor="start" font-weight="400">Repeated course GPAX stays blocked:</text><text x="83" y="1080" font-size="14" fill="#000000" text-anchor="start" font-weight="400">REPEAT_RULE_UNVERIFIED.</text><text x="83" y="1100" font-size="14" fill="#000000" text-anchor="start" font-weight="400">No invented replacement rule.</text></g><g class="node" data-title="Recoverable failures" data-x="1185" data-y="990" data-w="350" data-h="153"><rect x="1185" y="990" width="350" height="153" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><path d="M1185 1025H1535" fill="none" stroke="#000000" stroke-width="1.2"/><text x="1360.0" y="1015" font-size="17" fill="#000000" text-anchor="middle" font-weight="600">Recoverable failures</text><text x="1203" y="1040" font-size="14" fill="#000000" text-anchor="start" font-weight="400">Bad entries -&gt; correct and resubmit.</text><text x="1203" y="1060" font-size="14" fill="#000000" text-anchor="start" font-weight="400">OCR failure -&gt; manual setup.</text><text x="1203" y="1080" font-size="14" fill="#000000" text-anchor="start" font-weight="400">Gemini failure -&gt; Thai template.</text><text x="1203" y="1100" font-size="14" fill="#000000" text-anchor="start" font-weight="400">Zero GPAX denominator -&gt; no value.</text></g><rect x="819.1" y="405" width="61.8" height="22" fill="#ffffff"/><text x="850" y="420" font-size="12" fill="#000000" text-anchor="middle" font-weight="400">Accept</text><rect x="819.55" y="554" width="112.89999999999999" height="22" fill="#ffffff"/><text x="876" y="569" font-size="12" fill="#000000" text-anchor="middle" font-weight="400">Either choice</text><rect x="462.1" y="598" width="61.8" height="22" fill="#ffffff"/><text x="493" y="613" font-size="12" fill="#000000" text-anchor="middle" font-weight="400">Create</text><rect x="1076.4" y="598" width="47.2" height="22" fill="#ffffff"/><text x="1100" y="613" font-size="12" fill="#000000" text-anchor="middle" font-weight="400">Join</text><rect x="277.75" y="812" width="200.5" height="22" fill="#ffffff"/><text x="378" y="827" font-size="12" fill="#000000" text-anchor="middle" font-weight="400">Confirmed valid structure</text><rect x="1190.5" y="812" width="91.0" height="22" fill="#ffffff"/><text x="1236" y="827" font-size="12" fill="#000000" text-anchor="middle" font-weight="400">Valid code</text><rect x="460.45" y="309" width="69.1" height="22" fill="#ffffff"/><text x="495" y="324" font-size="12" fill="#000000" text-anchor="middle" font-weight="400">Decline</text><text x="65" y="1292" font-size="14" fill="#000000" text-anchor="start" font-weight="400">Notifications are a separate scheduled flow, not a required step of this screen journey (Figure 8).</text><text x="48" y="1346" font-size="12" fill="#000000" text-anchor="start" font-weight="400">Student interface | Academic processing | Identity / consent decision | Failure or limitation</text><text x="48" y="1373" font-size="12" fill="#000000" text-anchor="start" font-weight="400">Implementation baseline 639686b | Migrations 001-006 | Prepared 01 November 2026</text><text x="1552" y="1373" font-size="12" fill="#000000" text-anchor="end" font-weight="400">06 / 11</text></svg>