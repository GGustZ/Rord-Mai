<text x="60" y="2130" font-family="Arial" font-size="22">Foreign keys (editable graph connections are in ERD.drawio)</text>
<text x="60" y="2170" font-family="Arial" font-size="14">academic_profiles → students: FOREIGN KEY (student_id) REFERENCES students(id) ON DELETE CASCADE</text>
<text x="60" y="2195" font-family="Arial" font-size="14">attendance → enrollments: FOREIGN KEY (enrollment_id, section_id) REFERENCES enrollments(id, section_id) ON DELETE CASCADE</text>
<text x="60" y="2220" font-family="Arial" font-size="14">attendance → components: FOREIGN KEY (component_id, section_id) REFERENCES components(id, section_id) ON DELETE RESTRICT</text>
<text x="60" y="2245" font-family="Arial" font-size="14">components → sections: FOREIGN KEY (section_id) REFERENCES sections(id) ON DELETE CASCADE</text>
<text x="60" y="2270" font-family="Arial" font-size="14">conversation_state → students: FOREIGN KEY (student_id) REFERENCES students(id) ON DELETE CASCADE</text>
<text x="60" y="2295" font-family="Arial" font-size="14">enrollments → students: FOREIGN KEY (student_id) REFERENCES students(id) ON DELETE CASCADE</text>
<text x="60" y="2320" font-family="Arial" font-size="14">enrollments → sections: FOREIGN KEY (section_id) REFERENCES sections(id) ON DELETE RESTRICT</text>
<text x="60" y="2345" font-family="Arial" font-size="14">grading_revisions → students: FOREIGN KEY (actor_id) REFERENCES students(id) ON DELETE SET NULL</text>
<text x="60" y="2370" font-family="Arial" font-size="14">grading_revisions → sections: FOREIGN KEY (section_id) REFERENCES sections(id) ON DELETE CASCADE</text>
<text x="60" y="2395" font-family="Arial" font-size="14">private_jobs → students: FOREIGN KEY (student_id) REFERENCES students(id) ON DELETE CASCADE</text>
<text x="60" y="2420" font-family="Arial" font-size="14">scores → components: FOREIGN KEY (component_id, section_id) REFERENCES components(id, section_id) ON DELETE RESTRICT</text>
<text x="60" y="2445" font-family="Arial" font-size="14">scores → enrollments: FOREIGN KEY (enrollment_id, section_id) REFERENCES enrollments(id, section_id) ON DELETE CASCADE</text>
<text x="60" y="2470" font-family="Arial" font-size="14">sections → students: FOREIGN KEY (creator_id) REFERENCES students(id) ON DELETE SET NULL</text>
<text x="60" y="2495" font-family="Arial" font-size="14">deadline_notifications → students: FOREIGN KEY (student_id) REFERENCES students(id) ON DELETE CASCADE</text>
<text x="60" y="2520" font-family="Arial" font-size="14">deadline_notifications → sections: FOREIGN KEY (section_id) REFERENCES sections(id) ON DELETE CASCADE</text>
