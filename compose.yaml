services:
  db:
    image: postgres:18-bookworm
    environment:
      POSTGRES_USER: rordmai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: rordmai
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rordmai -d rordmai"]
      interval: 5s
      retries: 10
  app:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: postgresql://rordmai:${POSTGRES_PASSWORD}@db:5432/rordmai
      LINE_LOGIN_CHANNEL_ID: ${LINE_LOGIN_CHANNEL_ID:?Set LINE_LOGIN_CHANNEL_ID}
      LIFF_ID: ${LIFF_ID:?Set LIFF_ID}
      STORAGE_POLICY_VERSION: ${STORAGE_POLICY_VERSION:-2026-09-demo-v1}
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:

